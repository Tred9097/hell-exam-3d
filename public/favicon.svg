<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep navy/dark slate at top fading into vibrant warm sunset orange at bottom -->
    <linearGradient id="bgGrad" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0%" stop-color="#182338" />
      <stop offset="28%" stop-color="#1e2c45" />
      <stop offset="55%" stop-color="#d9541e" />
      <stop offset="80%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Top Cap Diamond Surface Gradient -->
    <linearGradient id="capTopGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Cap Base Left/Right Facet Shading -->
    <linearGradient id="capBaseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#3f4d63" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Tassel Gold Gradient -->
    <linearGradient id="goldTassel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Squircle / Rounded Rectangle Background -->
  <rect x="6" y="6" width="116" height="116" rx="34" ry="34" fill="url(#bgGrad)" />

  <!-- Graduation Cap Group centered -->
  <g transform="translate(0, 3)">
    <!-- 1. THICK BLACK OUTLINE / SHADOW BASE (Sticker outline effect) -->
    <!-- Lower crown outline -->
    <path d="M40 58 L40 70 C40 76 50 82 64 82 C78 82 88 76 88 70 L88 58 Z" 
          fill="#000000" stroke="#000000" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" />
    
    <!-- Top diamond outline -->
    <polygon points="64,28 98,46 64,64 30,46" 
             fill="#000000" stroke="#000000" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Tassel outline -->
    <path d="M64 45 L50 54 L50 71" 
          fill="none" stroke="#000000" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="50" cy="74" r="6" fill="#000000" />

    <!-- 2. CAP BASE / CROWN (Dark slate 3D volume under diamond) -->
    <path d="M40 56 L40 68 C40 74 50 80 64 80 C78 80 88 74 88 68 L88 56 C79 61 71 63 64 63 C57 63 49 61 40 56 Z" 
          fill="url(#capBaseGrad)" stroke="#111827" stroke-width="2" />

    <!-- 3. TOP CAP DIAMOND / MORTARBOARD -->
    <polygon points="64,29 97,46 64,63 31,46" 
             fill="url(#capTopGrad)" stroke="#334155" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Subtle edge highlight on top surface -->
    <polyline points="32,46 64,29.5 96,46" 
              fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />

    <!-- 4. GOLD TASSEL (Dây tua rua vàng nghệ rực rỡ) -->
    <!-- Ribbon from center to corner and down -->
    <path d="M64 45 L49.5 54 L49.5 70" 
          fill="none" stroke="url(#goldTassel)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center button on cap -->
    <ellipse cx="64" cy="45" rx="3.5" ry="2.2" fill="#f59e0b" />

    <!-- Small ring at bend/hanging point -->
    <circle cx="49.5" cy="70" r="2.2" fill="#fef08a" />

    <!-- Tassel brush / fringe at bottom -->
    <path d="M46 72 L45 80 C45 81 47 82 49.5 82 C52 82 54 81 54 80 L53 72 Z" 
          fill="url(#goldTassel)" />
    <!-- Tassel highlight -->
    <line x1="49.5" y1="73" x2="49.5" y2="81" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" />
  </g>
</svg>
