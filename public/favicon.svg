<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="45%" stop-color="#7f1d1d" />
      <stop offset="85%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>

    <!-- Gold Border Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Horns Gradient -->
    <linearGradient id="hornGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="60%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#fca5a5" />
    </linearGradient>

    <!-- Cap Gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Fire Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with Gold Border -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- Hell Flames at Bottom -->
  <path d="M28 98 C36 82 44 92 48 76 C52 90 60 72 64 64 C68 74 78 86 80 76 C84 92 92 82 100 98 C88 108 40 108 28 98 Z" 
        fill="#f97316" opacity="0.85" filter="url(#glow)" />
  <path d="M38 100 C44 88 50 94 54 82 C58 92 64 78 64 72 C64 80 72 90 74 82 C78 94 84 88 90 100 C80 106 48 106 38 100 Z" 
        fill="#fde047" opacity="0.9" />

  <!-- Demon Horns rising up behind cap -->
  <!-- Left Horn -->
  <path d="M38 52 C32 36 24 22 18 16 C28 22 42 32 46 48 Z" 
        fill="url(#hornGrad)" stroke="#7f1d1d" stroke-width="1.5" />
  <!-- Right Horn -->
  <path d="M90 52 C96 36 104 22 110 16 C100 22 86 32 82 48 Z" 
        fill="url(#hornGrad)" stroke="#7f1d1d" stroke-width="1.5" />

  <!-- Skull / Demon Face Base -->
  <ellipse cx="64" cy="68" rx="26" ry="24" fill="#0f172a" stroke="#dc2626" stroke-width="2" />

  <!-- Fiery Glowing Eyes -->
  <ellipse cx="53" cy="67" rx="5.5" ry="4" fill="#ef4444" transform="rotate(-10 53 67)" />
  <ellipse cx="53" cy="67" rx="3" ry="2" fill="#fef08a" transform="rotate(-10 53 67)" />
  
  <ellipse cx="75" cy="67" rx="5.5" ry="4" fill="#ef4444" transform="rotate(10 75 67)" />
  <ellipse cx="75" cy="67" rx="3" ry="2" fill="#fef08a" transform="rotate(10 75 67)" />

  <!-- Devil Grin / Teeth -->
  <path d="M52 80 Q64 88 76 80" stroke="#f87171" stroke-width="2" fill="none" stroke-linecap="round" />
  <line x1="56" y1="80" x2="56" y2="83" stroke="#f87171" stroke-width="1.5" />
  <line x1="61" y1="82" x2="61" y2="85" stroke="#f87171" stroke-width="1.5" />
  <line x1="67" y1="82" x2="67" y2="85" stroke="#f87171" stroke-width="1.5" />
  <line x1="72" y1="80" x2="72" y2="83" stroke="#f87171" stroke-width="1.5" />

  <!-- Mortarboard Diamond (Mũ Cử Nhân Tốt Nghiệp) -->
  <polygon points="64,24 108,44 64,58 20,44" 
           fill="url(#capGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Cap Crown/Base Under Diamond -->
  <path d="M38 48 L38 58 C38 66 90 66 90 58 L90 48 Z" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="1.5" />

  <!-- Cap Center Button -->
  <circle cx="64" cy="41" r="3.5" fill="#fef08a" stroke="#ca8a04" stroke-width="1" />

  <!-- Gold Tassel Ribbon -->
  <path d="M64 41 Q86 42 88 56" stroke="#eab308" stroke-width="2.2" fill="none" stroke-linecap="round" />
  <circle cx="88" cy="58" r="2.5" fill="#fde047" />
  <!-- Tassel Brush -->
  <path d="M86 59 L84 72 L92 72 L90 59 Z" fill="#facc15" stroke="#ca8a04" stroke-width="0.8" />

  <!-- Small pentagram / gold star on skull forehead -->
  <polygon points="64,52 65.5,56 69.5,56 66.5,58.5 67.5,62.5 64,60 60.5,62.5 61.5,58.5 58.5,56 62.5,56" 
           fill="#facc15" />
</svg>
